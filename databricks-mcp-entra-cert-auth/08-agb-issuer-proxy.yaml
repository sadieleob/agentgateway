# Backend for the OAuth issuer proxy — routes /oauth-issuer/* to the
# enterprise-agentgateway controller's STS server on port 7777.
# Required for MCP clients to reach authorization_endpoint, token_endpoint,
# /register, /par, and /callback/upstream.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: issuer-proxy-backend
  namespace: agentgateway-system
spec:
  static:
    host: enterprise-agentgateway.agentgateway-system.svc.cluster.local
    port: 7777
