# KGW_OAUTH_ISSUER_CONFIG — configures the controller's STS as a full OAuth
# authorization server (authorization_code + refresh_token grants).
# Without this secret + env var, the STS only advertises token-exchange grants
# and has no authorization_endpoint — MCP clients fail with
# "Invalid input: authorization_endpoint expected string".
#
# certificate_key_pair_ref replaces client_secret. The two are mutually exclusive.
# Requires explicit {name, namespace} — it is not defaulted.
# The controller reads this at startup; restart after any edit.
#
# IMPORTANT: scopes must NOT use the api:// prefix — that forces v1.0 tokens.
# Requires requestedAccessTokenVersion: 2 in the Entra app manifest.
apiVersion: v1
kind: Secret
metadata:
  name: agentgateway-oauth-issuer-config
  namespace: agentgateway-system
type: Opaque
stringData:
  KGW_OAUTH_ISSUER_CONFIG: |
    {
      "gateway_config": {
        "base_url": "https://<MCP_GATEWAY_HOSTNAME>/oauth-issuer"
      },
      "downstream_server": {
        "name": "downstream",
        "client_id": "<ENTRA_APP_CLIENT_ID>",
        "certificate_key_pair_ref": {
          "name": "entra-client-cert",
          "namespace": "agentgateway-system"
        },
        "authorize_url": "https://login.microsoftonline.com/<ENTRA_TENANT_ID>/oauth2/v2.0/authorize",
        "token_url": "https://login.microsoftonline.com/<ENTRA_TENANT_ID>/oauth2/v2.0/token",
        "scopes": [
          "<ENTRA_APP_CLIENT_ID>/agentgateway"
        ]
      },
      "consent": {
        "enabled": true,
        "platform_name": "Solo AI Gateway"
      }
    }
