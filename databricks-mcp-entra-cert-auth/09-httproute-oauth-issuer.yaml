# Routes /oauth-issuer/* to the controller's STS server.
# Without this route, MCP clients get 404 "route not found" when trying to
# reach /oauth-issuer/register, /authorize, /token, /callback/upstream — all
# advertised in .well-known/oauth-authorization-server metadata.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth-issuer-route
  namespace: agentgateway-system
spec:
  parentRefs:
  - name: agw-databricks-entra
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /oauth-issuer
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: issuer-proxy-backend
