# Atlassian supports dynamic client registration (chained DCR): no client_id/secret.
# offline_access gives a refresh token (no re-consent when the access token expires).
apiVersion: v1
kind: Secret
metadata:
  name: atlassian-token-exchange
  namespace: agentgateway-system
type: Opaque
stringData:
  app_id: "atlassian"
  base_url: "https://mcp.atlassian.com"
  scopes: "read:jira-work offline_access"
  mcp_resource: "/mcp/atlassian"
