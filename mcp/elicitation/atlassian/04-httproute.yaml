apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: atlassian-mcp-route
  namespace: agentgateway-system
spec:
  parentRefs:
  - name: agentgateway-mcp
    namespace: agentgateway-system
  rules:
  - matches:
    - path: {type: PathPrefix, value: /mcp/atlassian}
    - path: {type: PathPrefix, value: /.well-known/oauth-protected-resource/mcp/atlassian}
    - path: {type: PathPrefix, value: /.well-known/oauth-authorization-server/mcp/atlassian}
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: atlassian-mcp-backend
