# Elicitation: on first use the gateway sends the user to Atlassian to consent, stores the
# per-user upstream token (encrypted, keyed by Entra sub + backend) and injects it upstream.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: atlassian-mcp-exchange
  namespace: agentgateway-system
spec:
  targetRefs:
  - group: agentgateway.dev
    kind: AgentgatewayBackend
    name: atlassian-mcp-backend
  backend:
    tokenExchange:
      elicitation:
        secretName: atlassian-token-exchange
