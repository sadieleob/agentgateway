apiVersion: v1
kind: Secret
metadata:
  name: combined-postman-token-exchange
  namespace: agentgateway-system
type: Opaque
stringData:
  app_id: postman
  base_url: https://mcp.postman.com
  client_name: Postman
  mcp_resource: /mcp/postman
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: combined-postman-backend
  namespace: agentgateway-system
spec:
  mcp:
    targets:
    - name: mcp-target-postman
      static:
        host: mcp.postman.com
        path: /minimal
        port: 443
  policies:
    mcp:
      authentication:
        audiences:
        - api://REPLACE_WITH_ENTRA_CLIENT_ID
        issuer: https://sts.windows.net/REPLACE_WITH_ENTRA_TENANT_ID/
        jwks:
          backendRef:
            group: agentgateway.dev
            kind: AgentgatewayBackend
            name: entra-idp
          cacheDuration: 5m
          jwksPath: REPLACE_WITH_ENTRA_TENANT_ID/discovery/v2.0/keys
        mode: Strict
        resourceMetadata:
          agentgateway.dev/issuer-proxy: http://enterprise-agentgateway.agentgateway-system.svc.cluster.local:7777/oauth-issuer
          authorizationServers:
          - https://REPLACE_WITH_GATEWAY_HOST/mcp/postman
          resource: https://REPLACE_WITH_GATEWAY_HOST/mcp/postman
          scopesSupported:
          - api://REPLACE_WITH_ENTRA_CLIENT_ID/agentgateway
    tls: {}
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: combined-postman-exchange
  namespace: agentgateway-system
spec:
  backend:
    tokenExchange:
      elicitation:
        secretName: combined-postman-token-exchange
  targetRefs:
  - group: agentgateway.dev
    kind: AgentgatewayBackend
    name: combined-postman-backend
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: combined-postman-route
  namespace: agentgateway-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-mcp
    namespace: agentgateway-system
    sectionName: https
  rules:
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: combined-postman-backend
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /mcp/postman
    - path:
        type: PathPrefix
        value: /.well-known/oauth-protected-resource/mcp/postman
    - path:
        type: PathPrefix
        value: /.well-known/oauth-authorization-server/mcp/postman
