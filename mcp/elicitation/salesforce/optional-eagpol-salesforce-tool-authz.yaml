apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: salesforce-tool-authz
  namespace: agentgateway-system
spec:
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
          - jwt.groups.exists(g, g == "REPLACE_WITH_ENTRA_GROUP_ID") && mcp.tool.name in ["getObjectSchema", "soqlQuery", "find", "getUserInfo", "listRecentSobjectRecords", "getRelatedRecords"]
  targetRefs:
  - group: enterpriseagentgateway.solo.io
    kind: EnterpriseAgentgatewayBackend
    name: combined-salesforce-backend
