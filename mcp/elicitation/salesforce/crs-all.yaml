apiVersion: v1
kind: Secret
metadata:
  name: combined-salesforce-token-exchange
  namespace: agentgateway-system
type: Opaque
stringData:
  access_token_url: https://REPLACE_WITH_SF_MY_DOMAIN/services/oauth2/token
  app_id: salesforce
  authorize_url: https://REPLACE_WITH_SF_MY_DOMAIN/services/oauth2/authorize
  client_id: REPLACE_WITH_ECA_CONSUMER_KEY
  client_name: Salesforce
  mcp_resource: /mcp/salesforce
  scopes: mcp_api refresh_token openid
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: combined-salesforce-backend
  namespace: agentgateway-system
spec:
  entMcp:
    targets:
    - name: mcp-target-salesforce
      static:
        host: api.salesforce.com
        path: REPLACE_WITH_SF_MCP_SERVER_PATH
        port: 443
        protocol: StreamableHTTP
  policies:
    mcp:
      authentication:
        audiences:
        - api://REPLACE_WITH_ENTRA_CLIENT_ID
        issuer: https://sts.windows.net/REPLACE_WITH_ENTRA_TENANT_ID/
        jwks:
          backendRef:
            group: agentgateway.dev
            kind: AgentgatewayBackend
            name: entra-idp
          cacheDuration: 5m
          jwksPath: REPLACE_WITH_ENTRA_TENANT_ID/discovery/v2.0/keys
        mode: Strict
        resourceMetadata:
          agentgateway.dev/issuer-proxy: http://enterprise-agentgateway.agentgateway-system.svc.cluster.local:7777/oauth-issuer
          authorizationServers:
          - https://REPLACE_WITH_GATEWAY_HOST/mcp/salesforce
          resource: https://REPLACE_WITH_GATEWAY_HOST/mcp/salesforce
          scopesSupported:
          - api://REPLACE_WITH_ENTRA_CLIENT_ID/agentgateway
    tls: {}
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: combined-salesforce-exchange
  namespace: agentgateway-system
spec:
  backend:
    tokenExchange:
      elicitation:
        secretName: combined-salesforce-token-exchange
  targetRefs:
  - group: enterpriseagentgateway.solo.io
    kind: EnterpriseAgentgatewayBackend
    name: combined-salesforce-backend
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: combined-salesforce-route
  namespace: agentgateway-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-mcp
    namespace: agentgateway-system
    sectionName: https
  rules:
  - backendRefs:
    - group: enterpriseagentgateway.solo.io
      kind: EnterpriseAgentgatewayBackend
      name: combined-salesforce-backend
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /mcp/salesforce
    - path:
        type: PathPrefix
        value: /.well-known/oauth-protected-resource/mcp/salesforce
    - path:
        type: PathPrefix
        value: /.well-known/oauth-authorization-server/mcp/salesforce
