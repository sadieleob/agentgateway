apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: combined-cloudflare-exchange
  namespace: agentgateway-system
spec:
  backend:
    tokenExchange:
      elicitation:
        secretName: combined-cloudflare-token-exchange
  targetRefs:
  - group: agentgateway.dev
    kind: AgentgatewayBackend
    name: combined-cloudflare-backend
