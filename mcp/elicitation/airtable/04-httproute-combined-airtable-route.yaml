apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: combined-airtable-route
  namespace: agentgateway-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-mcp
    namespace: agentgateway-system
    sectionName: https
  rules:
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: combined-airtable-backend
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /mcp/airtable
    - path:
        type: PathPrefix
        value: /.well-known/oauth-protected-resource/mcp/airtable
    - path:
        type: PathPrefix
        value: /.well-known/oauth-authorization-server/mcp/airtable
