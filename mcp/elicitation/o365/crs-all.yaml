apiVersion: v1
kind: Secret
metadata:
  name: combined-o365-token-exchange
  namespace: agentgateway-system
type: Opaque
stringData:
  access_token_url: https://login.microsoftonline.com/REPLACE_WITH_ENTRA_TENANT_ID/oauth2/v2.0/token
  app_id: o365
  authorize_url: https://login.microsoftonline.com/REPLACE_WITH_ENTRA_TENANT_ID/oauth2/v2.0/authorize
  client_id: REPLACE_WITH_O365_CLIENT_ID
  client_name: Microsoft 365
  client_secret: REPLACE_WITH_O365_CLIENT_SECRET
  mcp_resource: /mcp/o365
  scopes: api://e8c77dc2-69b3-43f4-bc51-3213c9d915b4/MCP.Application.Read.All offline_access
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: combined-o365-backend
  namespace: agentgateway-system
spec:
  mcp:
    targets:
    - name: mcp-target-o365
      static:
        host: mcp.svc.cloud.microsoft
        path: /enterprise
        port: 443
  policies:
    mcp:
      authentication:
        audiences:
        - api://REPLACE_WITH_ENTRA_CLIENT_ID
        issuer: https://sts.windows.net/REPLACE_WITH_ENTRA_TENANT_ID/
        jwks:
          backendRef:
            group: agentgateway.dev
            kind: AgentgatewayBackend
            name: entra-idp
          cacheDuration: 5m
          jwksPath: REPLACE_WITH_ENTRA_TENANT_ID/discovery/v2.0/keys
        mode: Strict
        resourceMetadata:
          agentgateway.dev/issuer-proxy: http://enterprise-agentgateway.agentgateway-system.svc.cluster.local:7777/oauth-issuer
          authorizationServers:
          - https://REPLACE_WITH_GATEWAY_HOST/mcp/o365
          resource: https://REPLACE_WITH_GATEWAY_HOST/mcp/o365
          scopesSupported:
          - api://REPLACE_WITH_ENTRA_CLIENT_ID/agentgateway
    tls: {}
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: combined-o365-exchange
  namespace: agentgateway-system
spec:
  backend:
    tokenExchange:
      elicitation:
        secretName: combined-o365-token-exchange
  targetRefs:
  - group: agentgateway.dev
    kind: AgentgatewayBackend
    name: combined-o365-backend
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: combined-o365-route
  namespace: agentgateway-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-mcp
    namespace: agentgateway-system
  rules:
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: combined-o365-backend
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /mcp/o365
    - path:
        type: PathPrefix
        value: /.well-known/oauth-protected-resource/mcp/o365
    - path:
        type: PathPrefix
        value: /.well-known/oauth-authorization-server/mcp/o365
