# Entra JWKS endpoint used by the MCP backends' JWT validation.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: entra-idp
  namespace: agentgateway-system
spec:
  static:
    host: login.microsoftonline.com
    port: 443
  policies:
    tls: {}
---
# The controller's oauth-issuer (/oauth-issuer on :7777), exposed through the gateway.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: issuer-proxy-backend
  namespace: agentgateway-system
spec:
  static:
    host: enterprise-agentgateway.agentgateway-system.svc.cluster.local
    port: 7777
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth-issuer-route
  namespace: agentgateway-system
spec:
  parentRefs:
  - name: agentgateway-mcp
    namespace: agentgateway-system
  rules:
  - matches:
    - path: {type: PathPrefix, value: /oauth-issuer}
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: issuer-proxy-backend
