# Needed by browser-based MCP clients (e.g. MCP Inspector). Add every MCP route here.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: mcp-cors
  namespace: agentgateway-system
spec:
  targetRefs:
  - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: oauth-issuer-route}
  - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: github-mcp-route}
  - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: atlassian-mcp-route}
  - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: datadog-mcp-route}
  traffic:
    cors:
      allowCredentials: false
      allowHeaders: ["*"]
      allowMethods: ["*"]
      allowOrigins: ["*"]
      exposeHeaders: [www-authenticate]
      maxAge: 5
