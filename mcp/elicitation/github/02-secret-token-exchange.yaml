# GitHub has no dynamic client registration: register a GitHub OAuth App and set its
# Authorization callback URL to https://REPLACE_WITH_GATEWAY_HOST/oauth-issuer/callback/upstream
apiVersion: v1
kind: Secret
metadata:
  name: github-token-exchange
  namespace: agentgateway-system
type: Opaque
stringData:
  app_id: "github"
  client_id: "REPLACE_WITH_GITHUB_OAUTH_APP_CLIENT_ID"
  client_secret: "REPLACE_WITH_GITHUB_OAUTH_APP_CLIENT_SECRET"
  authorize_url: "https://github.com/login/oauth/authorize"
  access_token_url: "https://github.com/login/oauth/access_token"
  scopes: "repo read:org"
  mcp_resource: "/mcp/github"
