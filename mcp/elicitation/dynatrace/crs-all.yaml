apiVersion: v1
kind: Secret
metadata:
  name: dynatrace-oauth-client
  namespace: agentgateway-system
type: Opaque
stringData:
  client_secret: REPLACE_WITH_DYNATRACE_CLIENT_SECRET
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: combined-dynatrace-backend
  namespace: agentgateway-system
spec:
  mcp:
    targets:
    - name: mcp-target-dynatrace
      static:
        host: REPLACE_WITH_DYNATRACE_ENV_HOST
        path: /platform-reserved/mcp-gateway/v0.1/servers/dynatrace-mcp/mcp
        port: 443
  policies:
    mcp:
      authentication:
        audiences:
        - api://REPLACE_WITH_ENTRA_CLIENT_ID
        issuer: https://sts.windows.net/REPLACE_WITH_ENTRA_TENANT_ID/
        jwks:
          backendRef:
            group: agentgateway.dev
            kind: AgentgatewayBackend
            name: entra-idp
          cacheDuration: 5m
          jwksPath: REPLACE_WITH_ENTRA_TENANT_ID/discovery/v2.0/keys
        mode: Strict
        resourceMetadata:
          agentgateway.dev/issuer-proxy: http://enterprise-agentgateway.agentgateway-system.svc.cluster.local:7777/oauth-issuer
          authorizationServers:
          - https://REPLACE_WITH_GATEWAY_HOST/mcp/dynatrace
          resource: https://REPLACE_WITH_GATEWAY_HOST/mcp/dynatrace
          scopesSupported:
          - api://REPLACE_WITH_ENTRA_CLIENT_ID/agentgateway
    tls: {}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: dynatrace-sso
  namespace: agentgateway-system
spec:
  policies:
    tls: {}
  static:
    host: sso.dynatrace.com
    port: 443
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: combined-dynatrace-exchange
  namespace: agentgateway-system
spec:
  backend:
    entElicitation:
      brokered:
        chainedAuth:
          oauth:
            accessTokenUrl: http://agentgateway-mcp.agentgateway-system.svc.cluster.local:8080/oauth-upstream/dynatrace/token
            authorizeUrl: https://sso.dynatrace.com/oauth2/authorize?resource=https%3A%2F%2FREPLACE_WITH_DYNATRACE_ENV_HOST%2Fplatform-reserved%2Fmcp-gateway%2Fv0.1%2Fservers%2Fdynatrace-mcp%2Fmcp
            clientId: REPLACE_WITH_DYNATRACE_CLIENT_ID
            clientName: Dynatrace
            clientSecretRef:
              key: client_secret
              name: dynatrace-oauth-client
            pkce: Always
            scopes:
            - mcp-gateway:servers:invoke
            - mcp-gateway:servers:read
            - storage:logs:read
            - storage:metrics:read
        mcpResourcePath: /mcp/dynatrace
    entTokenExchange:
      solo:
        elicitation: {}
  targetRefs:
  - group: agentgateway.dev
    kind: AgentgatewayBackend
    name: combined-dynatrace-backend
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: dynatrace-token-resource
  namespace: agentgateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: dynatrace-token-resource
  traffic:
    transformation:
      request:
        body: |
          form.encode(form.decode(request.body).merge({
            "resource": "https://REPLACE_WITH_DYNATRACE_ENV_HOST/platform-reserved/mcp-gateway/v0.1/servers/dynatrace-mcp/mcp"
          }))
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: combined-dynatrace-route
  namespace: agentgateway-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-mcp
    namespace: agentgateway-system
  rules:
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: combined-dynatrace-backend
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /mcp/dynatrace
    - path:
        type: PathPrefix
        value: /.well-known/oauth-protected-resource/mcp/dynatrace
    - path:
        type: PathPrefix
        value: /.well-known/oauth-authorization-server/mcp/dynatrace
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dynatrace-token-resource
  namespace: agentgateway-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-mcp
    sectionName: internal-http
  rules:
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: dynatrace-sso
      weight: 1
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replaceFullPath: /sso/oauth2/token
          type: ReplaceFullPath
    matches:
    - method: POST
      path:
        type: Exact
        value: /oauth-upstream/dynatrace/token
