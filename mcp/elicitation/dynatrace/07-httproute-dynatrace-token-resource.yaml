apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dynatrace-token-resource
  namespace: agentgateway-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-mcp
    sectionName: internal-http
  rules:
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: dynatrace-sso
      weight: 1
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replaceFullPath: /sso/oauth2/token
          type: ReplaceFullPath
    matches:
    - method: POST
      path:
        type: Exact
        value: /oauth-upstream/dynatrace/token
