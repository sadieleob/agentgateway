# Elicitation: on first use the gateway sends the user to Datadog to consent, stores the
# per-user upstream token (encrypted, keyed by Entra sub + backend) and injects it upstream.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: datadog-mcp-exchange
  namespace: agentgateway-system
spec:
  targetRefs:
  - group: agentgateway.dev
    kind: AgentgatewayBackend
    name: datadog-mcp-backend
  backend:
    tokenExchange:
      elicitation:
        secretName: datadog-token-exchange
