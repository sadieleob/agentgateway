# Datadog supports dynamic client registration (chained DCR): no client_id/secret.
# base_url MUST include /v1/mcp: it has to equal the issuer in Datadog's AS metadata,
# otherwise the flow fails with "issuer ... does not match base_url".
# Region-specific host (US1 shown); EU = mcp.datadoghq.eu, US5 = us5.datadoghq.com.
apiVersion: v1
kind: Secret
metadata:
  name: datadog-token-exchange
  namespace: agentgateway-system
type: Opaque
stringData:
  app_id: "datadog"
  base_url: "https://mcp.datadoghq.com/v1/mcp"
  scopes: "mcp_all"
  mcp_resource: "/mcp/datadog"
