apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: combined-datadog-route
  namespace: agentgateway-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-mcp
    namespace: agentgateway-system
  rules:
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: combined-datadog-backend
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /mcp/datadog
    - path:
        type: PathPrefix
        value: /.well-known/oauth-protected-resource/mcp/datadog
    - path:
        type: PathPrefix
        value: /.well-known/oauth-authorization-server/mcp/datadog
