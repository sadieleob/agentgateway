apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: combined-servicenow-backend
  namespace: agentgateway-system
spec:
  entMcp:
    targets:
    - name: mcp-target-servicenow
      static:
        host: REPLACE_WITH_SERVICENOW_INSTANCE_HOST
        openAPI:
          schemaRef:
            name: combined-servicenow-openapi-schema
        port: 443
        protocol: OpenAPI
  policies:
    mcp:
      authentication:
        audiences:
        - api://REPLACE_WITH_ENTRA_CLIENT_ID
        issuer: https://sts.windows.net/REPLACE_WITH_ENTRA_TENANT_ID/
        jwks:
          backendRef:
            group: agentgateway.dev
            kind: AgentgatewayBackend
            name: entra-idp
          cacheDuration: 5m
          jwksPath: REPLACE_WITH_ENTRA_TENANT_ID/discovery/v2.0/keys
        mode: Strict
        resourceMetadata:
          agentgateway.dev/issuer-proxy: http://enterprise-agentgateway.agentgateway-system.svc.cluster.local:7777/oauth-issuer
          authorizationServers:
          - https://REPLACE_WITH_GATEWAY_HOST/mcp/servicenow
          resource: https://REPLACE_WITH_GATEWAY_HOST/mcp/servicenow
          scopesSupported:
          - api://REPLACE_WITH_ENTRA_CLIENT_ID/agentgateway
    tls: {}
