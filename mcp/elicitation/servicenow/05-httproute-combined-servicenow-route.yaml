apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: combined-servicenow-route
  namespace: agentgateway-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-mcp
    namespace: agentgateway-system
    sectionName: https
  rules:
  - backendRefs:
    - group: enterpriseagentgateway.solo.io
      kind: EnterpriseAgentgatewayBackend
      name: combined-servicenow-backend
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /mcp/servicenow
    - path:
        type: PathPrefix
        value: /.well-known/oauth-protected-resource/mcp/servicenow
    - path:
        type: PathPrefix
        value: /.well-known/oauth-authorization-server/mcp/servicenow
