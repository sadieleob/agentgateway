apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: github-noauth-auth
  namespace: agentgateway-system
spec:
  backend:
    mcp:
      authentication:
        audiences:
        - api://REPLACE_WITH_ENTRA_CLIENT_ID
        issuer: https://sts.windows.net/REPLACE_WITH_ENTRA_TENANT_ID/
        jwks:
          backendRef:
            group: agentgateway.dev
            kind: AgentgatewayBackend
            name: entra-idp
          cacheDuration: 5m
          jwksPath: REPLACE_WITH_ENTRA_TENANT_ID/discovery/v2.0/keys
        mode: Strict
        resourceMetadata:
          agentgateway.dev/issuer-proxy: http://enterprise-agentgateway.agentgateway-system.svc.cluster.local:7777/oauth-issuer
          authorizationServers:
          - https://REPLACE_WITH_GATEWAY_HOST/mcp/github-noauth
          resource: https://REPLACE_WITH_GATEWAY_HOST/mcp/github-noauth
          scopesSupported:
          - api://REPLACE_WITH_ENTRA_CLIENT_ID/agentgateway
      authorization:
        action: Allow
        policy:
          matchExpressions:
          - jwt.groups.exists(g, g == "REPLACE_WITH_ENTRA_GROUP_ID")
  targetRefs:
  - group: agentgateway.dev
    kind: AgentgatewayBackend
    name: github-app-backend
